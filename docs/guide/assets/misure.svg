<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450"
     role="img" aria-labelledby="t2 d2">
  <title id="t2">Due punti di misura e la convenzione dei segni</title>
  <desc id="d2">In alto: i pannelli producono in corrente continua (resa DC), l'inverter converte e la
    sua uscita è in corrente alternata (energia prodotta AC). Sono la stessa energia misurata in due
    punti diversi e non vanno sommate. In basso: sulla rete il segno positivo significa prelievo e il
    negativo immissione; sulla batteria il positivo significa carica e il negativo scarica.</desc>

  <style>
    .surface { fill: #ffffff; stroke: #ccd6e3; }
    .t       { fill: #0f1720; font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .m       { fill: #414e61; font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire    { stroke: #74849b; fill: none; stroke-width: 2.5; }
    .tick    { stroke: #74849b; fill: none; stroke-width: 1.6; stroke-dasharray: 5 5; }
    .rule    { stroke: #dbe3ed; stroke-width: 1.5; }
    .b       { font-weight: 700; }
    .solar   { fill: #eb6834; }
    .gridc   { fill: #2a78d6; }
    .batt    { fill: #1baf7a; }
    .solars  { stroke: #eb6834; }

    @media (prefers-color-scheme: dark) {
      .surface { fill: #161d27; stroke: #33404f; }
      .t       { fill: #e8edf4; }
      .m       { fill: #adbdd1; }
      .wire    { stroke: #73879f; }
      .tick    { stroke: #73879f; }
      .rule    { stroke: #33404f; }
      .solar   { fill: #d95926; }
      .gridc   { fill: #3987e5; }
      .batt    { fill: #199e70; }
      .solars  { stroke: #d95926; }
    }
  </style>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#74849b"/>
    </marker>
  </defs>

  <!-- ===================== BANDA 1 — DC e AC ===================== -->
  <text class="t b" x="30" y="30" font-size="17">Due punti di misura, una sola energia</text>

  <rect class="surface" x="30" y="80" width="170" height="96" rx="12" stroke-width="1.5"/>
  <rect class="solar" x="30" y="80" width="6" height="96" rx="3"/>
  <text class="t b" x="118" y="120" font-size="17" text-anchor="middle">Pannelli</text>
  <text class="m"   x="118" y="146" font-size="13" text-anchor="middle">producono in continua</text>

  <path class="wire" d="M 206 128 L 324 128" marker-end="url(#a2)"/>
  <path class="tick" d="M 264 64 L 264 192"/>
  <text class="m b" x="264" y="56" font-size="13" text-anchor="middle">misura 1</text>
  <text class="m"   x="264" y="212" font-size="13" text-anchor="middle">«dai pannelli (DC)»</text>

  <rect class="surface" x="330" y="80" width="170" height="96" rx="12" stroke-width="1.5"/>
  <text class="t b" x="415" y="120" font-size="17" text-anchor="middle">Inverter</text>
  <text class="m"   x="415" y="146" font-size="13" text-anchor="middle">converte in alternata</text>

  <path class="wire" d="M 506 128 L 634 128"/>
  <path class="tick" d="M 570 64 L 570 192"/>
  <text class="m b" x="570" y="56" font-size="13" text-anchor="middle">misura 2</text>
  <text class="m"   x="570" y="212" font-size="13" text-anchor="middle">«Prodotta» (AC)</text>

  <path class="wire" d="M 634 92 L 634 164"/>
  <path class="wire" d="M 634 92 L 682 92" marker-end="url(#a2)"/>
  <path class="wire" d="M 634 164 L 682 164" marker-end="url(#a2)"/>

  <rect class="surface" x="690" y="62" width="180" height="60" rx="12" stroke-width="1.5"/>
  <text class="t b" x="780" y="98" font-size="16" text-anchor="middle">Casa</text>

  <rect class="surface" x="690" y="134" width="180" height="60" rx="12" stroke-width="1.5"/>
  <rect class="gridc" x="690" y="134" width="6" height="60" rx="3"/>
  <text class="t b" x="780" y="170" font-size="16" text-anchor="middle">Rete</text>

  <text class="m" x="30" y="246" font-size="14">
    L'uscita in alternata è sempre un po' minore della resa in continua: la conversione ha le sue perdite.
  </text>
  <text class="m" x="30" y="268" font-size="14">
    Sono la stessa energia vista in due punti, quindi non si sommano mai.
  </text>

  <line class="rule" x1="30" y1="296" x2="950" y2="296"/>

  <!-- ===================== BANDA 2 — I SEGNI ===================== -->
  <rect class="surface" x="30" y="320" width="440" height="118" rx="12" stroke-width="1.5"/>
  <rect class="gridc" x="30" y="320" width="6" height="118" rx="3"/>
  <text class="t b" x="56" y="350" font-size="16">Rete</text>
  <text class="t b gridc" x="56" y="384" font-size="15">+</text>
  <text class="t b" x="76" y="384" font-size="15">prelievo</text>
  <text class="m"  x="166" y="384" font-size="14">stai comprando dalla rete</text>
  <text class="t b gridc" x="56" y="414" font-size="15">−</text>
  <text class="t b" x="76" y="414" font-size="15">immissione</text>
  <text class="m"  x="186" y="414" font-size="14">stai vendendo alla rete</text>

  <rect class="surface" x="510" y="320" width="440" height="118" rx="12" stroke-width="1.5"/>
  <rect class="batt" x="510" y="320" width="6" height="118" rx="3"/>
  <text class="t b" x="536" y="350" font-size="16">Batteria</text>
  <text class="t b batt" x="536" y="384" font-size="15">+</text>
  <text class="t b" x="556" y="384" font-size="15">carica</text>
  <text class="m"  x="626" y="384" font-size="14">sta accumulando</text>
  <text class="t b batt" x="536" y="414" font-size="15">−</text>
  <text class="t b" x="556" y="414" font-size="15">scarica</text>
  <text class="m"  x="626" y="414" font-size="14">sta alimentando la casa</text>
</svg>
