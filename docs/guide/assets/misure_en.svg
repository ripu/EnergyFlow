<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450"
     role="img" aria-labelledby="t2en d2en">
  <title id="t2en">Two measuring points and the sign convention</title>
  <desc id="d2en">Top: the panels produce direct current (DC yield), the inverter converts and its
    output is alternating current (energy produced, AC). They are the same energy measured at two
    different points and must never be added up. Bottom: on the grid a positive value means import
    and a negative one means export; on the battery positive means charging and negative discharging.</desc>

  <style>
    .surface { fill: #ffffff; stroke: #ccd6e3; }
    .t       { fill: #0f1720; font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .m       { fill: #414e61; font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire    { stroke: #74849b; fill: none; stroke-width: 2.5; }
    .tick    { stroke: #74849b; fill: none; stroke-width: 1.6; stroke-dasharray: 5 5; }
    .rule    { stroke: #dbe3ed; stroke-width: 1.5; }
    .b       { font-weight: 700; }
    .solar   { fill: #eb6834; }
    .gridc   { fill: #2a78d6; }
    .batt    { fill: #1baf7a; }

    @media (prefers-color-scheme: dark) {
      .surface { fill: #161d27; stroke: #33404f; }
      .t       { fill: #e8edf4; }
      .m       { fill: #adbdd1; }
      .wire    { stroke: #73879f; }
      .tick    { stroke: #73879f; }
      .rule    { stroke: #33404f; }
      .solar   { fill: #d95926; }
      .gridc   { fill: #3987e5; }
      .batt    { fill: #199e70; }
    }
  </style>

  <defs>
    <marker id="a2en" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#74849b"/>
    </marker>
  </defs>

  <text class="t b" x="30" y="30" font-size="17">Two measuring points, one single energy</text>

  <rect class="surface" x="30" y="80" width="170" height="96" rx="12" stroke-width="1.5"/>
  <rect class="solar" x="30" y="80" width="6" height="96" rx="3"/>
  <text class="t b" x="118" y="120" font-size="17" text-anchor="middle">Panels</text>
  <text class="m"   x="118" y="146" font-size="13" text-anchor="middle">produce direct current</text>

  <path class="wire" d="M 206 128 L 324 128" marker-end="url(#a2en)"/>
  <path class="tick" d="M 264 64 L 264 192"/>
  <text class="m b" x="264" y="56" font-size="13" text-anchor="middle">point 1</text>
  <text class="m"   x="264" y="212" font-size="13" text-anchor="middle">“from the panels (DC)”</text>

  <rect class="surface" x="330" y="80" width="170" height="96" rx="12" stroke-width="1.5"/>
  <text class="t b" x="415" y="120" font-size="17" text-anchor="middle">Inverter</text>
  <text class="m"   x="415" y="146" font-size="13" text-anchor="middle">converts to alternating</text>

  <path class="wire" d="M 506 128 L 634 128"/>
  <path class="tick" d="M 570 64 L 570 192"/>
  <text class="m b" x="570" y="56" font-size="13" text-anchor="middle">point 2</text>
  <text class="m"   x="570" y="212" font-size="13" text-anchor="middle">“Produced” (AC)</text>

  <path class="wire" d="M 634 92 L 634 164"/>
  <path class="wire" d="M 634 92 L 682 92" marker-end="url(#a2en)"/>
  <path class="wire" d="M 634 164 L 682 164" marker-end="url(#a2en)"/>

  <rect class="surface" x="690" y="62" width="180" height="60" rx="12" stroke-width="1.5"/>
  <text class="t b" x="780" y="98" font-size="16" text-anchor="middle">Home</text>

  <rect class="surface" x="690" y="134" width="180" height="60" rx="12" stroke-width="1.5"/>
  <rect class="gridc" x="690" y="134" width="6" height="60" rx="3"/>
  <text class="t b" x="780" y="170" font-size="16" text-anchor="middle">Grid</text>

  <text class="m" x="30" y="246" font-size="14">
    The AC output is always slightly lower than the DC yield: conversion has its own losses.
  </text>
  <text class="m" x="30" y="268" font-size="14">
    They are the same energy seen at two points, so they are never added together.
  </text>

  <line class="rule" x1="30" y1="296" x2="950" y2="296"/>

  <rect class="surface" x="30" y="320" width="440" height="118" rx="12" stroke-width="1.5"/>
  <rect class="gridc" x="30" y="320" width="6" height="118" rx="3"/>
  <text class="t b" x="56" y="350" font-size="16">Grid</text>
  <text class="t b gridc" x="56" y="384" font-size="15">+</text>
  <text class="t b" x="76" y="384" font-size="15">import</text>
  <text class="m"  x="156" y="384" font-size="14">you are buying from the grid</text>
  <text class="t b gridc" x="56" y="414" font-size="15">−</text>
  <text class="t b" x="76" y="414" font-size="15">export</text>
  <text class="m"  x="156" y="414" font-size="14">you are selling to the grid</text>

  <rect class="surface" x="510" y="320" width="440" height="118" rx="12" stroke-width="1.5"/>
  <rect class="batt" x="510" y="320" width="6" height="118" rx="3"/>
  <text class="t b" x="536" y="350" font-size="16">Battery</text>
  <text class="t b batt" x="536" y="384" font-size="15">+</text>
  <text class="t b" x="556" y="384" font-size="15">charging</text>
  <text class="m"  x="656" y="384" font-size="14">it is storing energy</text>
  <text class="t b batt" x="536" y="414" font-size="15">−</text>
  <text class="t b" x="556" y="414" font-size="15">discharging</text>
  <text class="m"  x="676" y="414" font-size="14">it is powering the house</text>
</svg>
