<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430"
     role="img" aria-labelledby="titolo descrizione">
  <title id="titolo">Come arrivano i dati dall'inverter allo schermo</title>
  <desc id="descrizione">L'inverter di casa parla Modbus TCP sulla porta 502. Un Raspberry Pi lo
    interroga ogni 5 secondi, tiene i valori in memoria e li serve su HTTP alla porta 8003, solo sul
    proprio loopback. Il pannello a muro, il telefono e il Mac leggono da lì. Nessun dato esce di casa.</desc>

  <style>
    .surface { fill: #ffffff; stroke: #ccd6e3; }
    .inner   { fill: #f4f7fb; stroke: #dbe3ed; }
    .frame   { fill: none; stroke: #b0bccd; stroke-dasharray: 7 6; }
    .t       { fill: #0f1720; font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .m       { fill: #414e61; font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire    { stroke: #74849b; fill: none; stroke-width: 2.5; }
    .b       { font-weight: 700; }
    .solar   { fill: #eb6834; }
    .gridc   { fill: #2a78d6; }
    .batt    { fill: #1baf7a; }

    @media (prefers-color-scheme: dark) {
      .surface { fill: #161d27; stroke: #33404f; }
      .inner   { fill: #1f2836; stroke: #33404f; }
      .frame   { stroke: #5a6b81; }
      .t       { fill: #e8edf4; }
      .m       { fill: #adbdd1; }
      .wire    { stroke: #73879f; }
      .solar   { fill: #d95926; }
      .gridc   { fill: #3987e5; }
      .batt    { fill: #199e70; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#74849b"/>
    </marker>
  </defs>

  <!-- Perimetro di casa -->
  <rect class="frame" x="10" y="10" width="960" height="360" rx="18"/>
  <text class="m b" x="30" y="38" font-size="14">IN CASA</text>

  <!-- ============================ INVERTER ============================ -->
  <rect class="surface" x="34" y="150" width="206" height="128" rx="14" stroke-width="1.5"/>
  <rect class="solar" x="34" y="150" width="6" height="128" rx="3"/>
  <text class="t b" x="137" y="192" font-size="19" text-anchor="middle">Inverter</text>
  <text class="m"   x="137" y="217" font-size="14" text-anchor="middle">fotovoltaico + batteria</text>
  <text class="m"   x="137" y="240" font-size="13" text-anchor="middle">SolaX X1-Hybrid G4</text>
  <text class="m"   x="137" y="259" font-size="13" text-anchor="middle">(Q.CELLS Q.HOME ESS)</text>

  <!-- Inverter -> Raspberry -->
  <path class="wire" d="M 246 214 L 322 214" marker-end="url(#arrow)"/>
  <text class="t b" x="284" y="196" font-size="14" text-anchor="middle">Modbus TCP</text>
  <text class="m"   x="284" y="236" font-size="13" text-anchor="middle">porta 502</text>
  <text class="m"   x="284" y="254" font-size="13" text-anchor="middle">ogni 5 s</text>

  <!-- =========================== RASPBERRY ============================ -->
  <rect class="surface" x="332" y="104" width="286" height="220" rx="14" stroke-width="1.5"/>
  <text class="t b" x="475" y="134" font-size="19" text-anchor="middle">Raspberry Pi</text>

  <rect class="inner" x="352" y="150" width="246" height="70" rx="10" stroke-width="1.5"/>
  <text class="t b" x="475" y="177" font-size="15" text-anchor="middle">Lettore dei registri</text>
  <text class="m"   x="475" y="200" font-size="13" text-anchor="middle">legge, controlla, tiene in memoria</text>

  <rect class="inner" x="352" y="232" width="246" height="70" rx="10" stroke-width="1.5"/>
  <text class="t b" x="475" y="259" font-size="15" text-anchor="middle">Pagina web · porta 8003</text>
  <text class="m"   x="475" y="282" font-size="13" text-anchor="middle">solo sul Pi · protetta da token</text>

  <!-- Raspberry -> clienti -->
  <path class="wire" d="M 624 214 L 686 214"/>
  <text class="t b" x="655" y="196" font-size="14" text-anchor="middle">HTTP</text>
  <path class="wire" d="M 686 152 L 686 276"/>
  <path class="wire" d="M 686 152 L 726 152" marker-end="url(#arrow)"/>
  <path class="wire" d="M 686 214 L 726 214" marker-end="url(#arrow)"/>
  <path class="wire" d="M 686 276 L 726 276" marker-end="url(#arrow)"/>

  <!-- ============================= CLIENTI ============================ -->
  <rect class="surface" x="734" y="122" width="220" height="62" rx="12" stroke-width="1.5"/>
  <text class="t b" x="844" y="148" font-size="15" text-anchor="middle">Pannello 32" a muro</text>
  <text class="m"   x="844" y="169" font-size="13" text-anchor="middle">verticale, sempre acceso</text>

  <rect class="surface" x="734" y="184" width="220" height="62" rx="12" stroke-width="1.5"/>
  <text class="t b" x="844" y="210" font-size="15" text-anchor="middle">Telefono</text>
  <text class="m"   x="844" y="231" font-size="13" text-anchor="middle">via Tailscale</text>

  <rect class="surface" x="734" y="246" width="220" height="62" rx="12" stroke-width="1.5"/>
  <text class="t b" x="844" y="272" font-size="15" text-anchor="middle">Mac</text>
  <text class="m"   x="844" y="293" font-size="13" text-anchor="middle">pagina + tre widget</text>

  <!-- Nota -->
  <text class="m" x="490" y="404" font-size="15" text-anchor="middle">
    Nessun cloud e nessun account: i dati non lasciano la rete di casa.
  </text>
</svg>
